[project]
name = "availability-engine"
version = "0.1.0"
description = "A reusable, domain-agnostic Python scheduling library"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.5",
    "tzdata==2026.3",
    "sqlalchemy>=2.0,<2.1",
    "asyncpg==0.31.0",
    "aiosqlite==0.22.1",
    "alembic==1.19.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "time-machine==3.5.0",
    "hypothesis==6.167.1",
    "testcontainers[postgres]==4.15.0",
]
# D-02/PKG-03: dev-only, opt-in conformance group — isolates the consumer's
# large transitive dev tree (anthropic, structlog, sqlalchemy, aiosqlite,
# alembic, pydantic-settings, tenacity, pyyaml) so a plain `uv sync` never
# pulls it in. Pinned to a real, pushed git tag (never `main`) per D-02.
conformance = [
    "socialnetwork-chatbot",
]

[tool.uv.sources]
socialnetwork-chatbot = { git = "https://github.com/Ygaray/SocialNetwork-Chatbot.git", tag = "v1.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/availability_engine"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "availability_engine/_migrations/alembic.ini"
"alembic" = "availability_engine/_migrations/alembic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Repo root on sys.path so tests/integration/conftest.py can import
# examples/chatbot_adapter.py -- examples/ is dev-only, deliberately never
# part of the installed wheel (D-03), so it has no other importable path.
pythonpath = ["."]
# contract_suite.py deliberately doesn't match "test_*.py" (it's a shared,
# imported suite, not a standalone test entry point) but must still be
# collected by a plain `pytest` invocation so Phase 4's SQLStore addition to
# its parametrize list is actually exercised by CI, not just by hand-typing
# the file path (STORE-02).
python_files = ["test_*.py", "*_test.py", "contract_suite.py"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"
