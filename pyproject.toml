[project]
name = "availability-engine"
version = "0.1.0"
description = "A reusable, domain-agnostic Python scheduling library"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/availability_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
