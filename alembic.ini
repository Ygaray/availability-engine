# Alembic configuration for availability-engine.
#
# This library is consumer-run rather than auto-applied on import (D-03 — a
# library does not own a runtime lifecycle). A consumer invokes
# `alembic upgrade head` themselves, supplying their own connection string
# via `-x sqlalchemy.url=<real-url>` or the SQLALCHEMY_URL environment
# variable (see alembic/env.py) — the placeholder below is never a real
# credential and is never overridden in this repo.

[alembic]
script_location = alembic

# Placeholder only — a consumer overrides this at migration-run time via
# `-x sqlalchemy.url=` or the SQLALCHEMY_URL environment variable. Never a
# real credential (T-04-06).
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
